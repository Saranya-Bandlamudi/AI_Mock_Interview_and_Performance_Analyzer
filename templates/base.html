<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}AI Mock Interview{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="{% block body_class %}{% endblock %}"><nav class="topbar shell"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">AI</span><span>Mock Interview</span></a><div class="nav-links"><a href="{{ url_for('index') }}">Home</a><a href="{{ url_for('setup') }}">Interview</a><a href="{{ url_for('index') }}#how-it-works">How it works</a><a href="{{ url_for('index') }}#about">About</a><a class="nav-cta" href="{{ url_for('setup') }}">Start interview <span>-></span></a></div><button class="menu-button" aria-label="Toggle navigation">&#9776;</button></nav>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="shell alert alert-error">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}<script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
